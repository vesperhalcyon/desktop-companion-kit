<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Desktop Companion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="pet" aria-label="Desktop Companion">
    <section id="speech" class="speech interactive" aria-live="polite" hidden>
      <p id="speechText"></p>
    </section>

    <section id="panel" class="panel interactive" hidden>
      <header>
        <div>
          <p id="characterEyebrow" class="eyebrow">DESKTOP COMPANION</p>
          <h1 id="characterTitle">A small presence at the edge of the screen.</h1>
        </div>
        <button id="closePanel" class="iconButton" type="button" aria-label="Close panel">×</button>
      </header>

      <form id="askForm">
        <label for="askInput">Say something</label>
        <div class="askRow">
          <input id="askInput" maxlength="180" autocomplete="off" placeholder="What do you think of this page?">
          <button type="submit">Ask</button>
        </div>
      </form>

      <div class="actions">
        <button id="pageButton" type="button">Comment on this page</button>
        <button id="moveButton" type="button">Relocate</button>
      </div>

      <div class="toggles">
        <label>
          <span>
            <strong>Page sight</strong>
            <small>Reads the active tab locally</small>
          </span>
          <input id="observePages" type="checkbox">
        </label>
        <label>
          <span>
            <strong>Wandering</strong>
            <small>Occasional desktop patrols</small>
          </span>
          <input id="wander" type="checkbox">
        </label>
        <label>
          <span>
            <strong>Idle comments</strong>
            <small>Dry observations, unrequested</small>
          </span>
          <input id="idleComments" type="checkbox">
        </label>
        <label>
          <span>
            <strong>Always on top</strong>
            <small>Keep the little menace visible</small>
          </span>
          <input id="alwaysOnTop" type="checkbox">
        </label>
        <label>
          <span>
            <strong>Open at login</strong>
            <small>Available after packaging</small>
          </span>
          <input id="launchAtLogin" type="checkbox">
        </label>
      </div>

      <footer>
        <button id="privacyButton" class="textButton" type="button">macOS privacy settings</button>
        <button id="quitButton" class="textButton danger" type="button">Quit</button>
      </footer>
    </section>

    <div id="avatarWrap" class="avatarWrap interactive" title="Click, drag, or right-click">
      <div class="groundGlow"></div>
      <img id="avatar" src="../assets/mascot.svg" alt="A tiny illustrated desktop companion">
      <button id="settingsButton" class="settingsButton" type="button" aria-label="Open desktop companion controls">
        <span></span><span></span><span></span>
      </button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
