name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package_script: package:mac
            artifact_name: desktop-companion-macos
          - os: windows-latest
            package_script: package:windows
            artifact_name: desktop-companion-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - if: runner.os == 'Windows'
        run: npm run probe:page
      - run: npm run ${{ matrix.package_script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: .artifacts/
          if-no-files-found: error
